<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal productivity dashboard with a focus timer, task list, and quick links.">
  <title>Todo Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme">
        <span id="theme-toggle-label">Dark mode</span>
      </button>
    </header>

    <div id="storage-banner" role="alert" aria-live="assertive">
      <span>Some preferences could not be saved because browser storage is unavailable.</span>
      <button class="banner-close" type="button" aria-label="Dismiss storage warning">×</button>
    </div>

    <main id="main-content" class="dashboard" aria-label="Todo Life Dashboard">
      <section class="panel panel-greeting" role="region" aria-labelledby="greeting-heading">
        <h2 id="greeting-heading">Today</h2>
        <p id="greeting-time" class="greeting-time" aria-live="polite" aria-atomic="true">--:--</p>
        <p id="greeting-date" class="greeting-date">Loading date…</p>
        <p id="greeting-message" class="greeting-message" aria-live="polite">Good day</p>

        <div class="field-group">
          <label for="greeting-name-input">Display name</label>
          <input id="greeting-name-input" name="greeting-name" type="text" maxlength="50" autocomplete="name" placeholder="Enter your name" aria-describedby="greeting-name-error">
          <span id="greeting-name-error" class="error-msg" role="alert" aria-live="polite"></span>
        </div>
      </section>

      <section class="panel panel-timer" role="region" aria-labelledby="timer-heading">
        <h2 id="timer-heading">Focus timer</h2>

        <div class="timer-display-wrap">
          <div id="timer-display" class="timer-display" role="timer" aria-live="off" aria-atomic="true" aria-label="Time remaining">25:00</div>
          <div class="timer-notification" role="status" aria-live="polite">Focus session complete!</div>
        </div>

        <div class="timer-controls">
          <button id="timer-start" type="button">Start</button>
          <button id="timer-stop" type="button" disabled>Stop</button>
          <button id="timer-reset" type="button">Reset</button>
        </div>

        <div class="field-group timer-duration-field">
          <label for="timer-duration">Duration (minutes)</label>
          <input id="timer-duration" name="timer-duration" type="number" min="1" max="120" step="1" value="25" inputmode="numeric" aria-describedby="timer-duration-error">
          <span id="timer-duration-error" class="error-msg" role="alert" aria-live="polite"></span>
        </div>
      </section>

      <section class="panel panel-tasks" role="region" aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Tasks</h2>

        <form id="task-form" class="dashboard-form">
          <div class="field-group">
            <label for="task-input">New task</label>
            <div class="inline-field">
              <input id="task-input" name="task" type="text" maxlength="200" autocomplete="off" placeholder="What needs to be done?" aria-describedby="task-input-error">
              <button type="submit">Add</button>
            </div>
            <span id="task-input-error" class="error-msg" role="alert" aria-live="polite"></span>
          </div>
        </form>

        <div class="field-group sort-field">
          <label for="task-sort">Sort tasks</label>
          <select id="task-sort" name="task-sort">
            <option value="default">Default (Date Added)</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
          </select>
        </div>

        <ul id="task-list" class="task-list" aria-labelledby="tasks-heading" aria-live="polite"></ul>
      </section>

      <section class="panel panel-links" role="region" aria-labelledby="links-heading">
        <h2 id="links-heading">Quick links</h2>

        <form id="link-add-form" class="dashboard-form">
          <div class="field-group">
            <label for="link-name-input">Link name</label>
            <input id="link-name-input" name="link-name" type="text" maxlength="50" autocomplete="off" placeholder="Example website" aria-describedby="link-name-error">
            <span id="link-name-error" class="error-msg" role="alert" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="link-url-input">URL</label>
            <input id="link-url-input" name="link-url" type="url" maxlength="2048" autocomplete="off" placeholder="https://example.com" required aria-describedby="link-url-error">
            <span id="link-url-error" class="error-msg" role="alert" aria-live="polite"></span>
          </div>

          <span id="link-capacity-error" class="error-msg" role="alert" aria-live="polite"></span>
          <span id="link-load-error" class="error-msg" role="alert" aria-live="polite" hidden></span>
          <button type="submit">Add Link</button>
        </form>

        <ul id="link-list" class="link-list" aria-labelledby="links-heading" aria-live="polite"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>Todo Life Dashboard</p>
    </footer>
  </div>
  <noscript>This dashboard requires JavaScript to run.</noscript>
</body>
</html>
